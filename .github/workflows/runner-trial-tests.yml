name: runner-trial-tests

on:
  # No paths filter on pull_request: a required check whose workflow is
  # skipped by a paths filter stays Pending and blocks the merge. The job
  # runs on every pull request and skips its real work when no watched path
  # changed (see .github/scripts/ci-gate.sh).
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runner-trial-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive-c1-tests:
    name: runner trial C1 driver tests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 brings the full history, so the pinned trial commits
      # (7efa0776 and 0678d921, the v1.3.0 tag) are present for git archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'misc/runner-trial/**'
          'misc/tests/test_drive_c1.py'
          'misc/evals/scripts/**'
          '.github/workflows/runner-trial-tests.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run the C1 driver tests (no model call)
        if: steps.changes.outputs.relevant != 'false'
        run: python3 -B -m unittest misc.tests.test_drive_c1 -v
