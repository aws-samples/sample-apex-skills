name: docs-sync

on:
  # No paths filter on pull_request: a required check whose workflow is
  # skipped by a paths filter stays Pending and blocks the merge. The job
  # runs on every pull request and skips its real work when no watched path
  # changed (see .github/scripts/ci-gate.sh).
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-sync:
    name: docs auto-gen blocks are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/**'
          'steering/**'
          'examples/**'
          'misc/**'
          'devops-agent/**'
          'README.md'
          'CONTRIBUTING.md'
          'THIRD_PARTY_NOTICES.md'
          '.github/workflows/docs-sync.yml'
          '.github/scripts/ci-gate.sh'
      - name: No-op (no watched path changed)
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No change to docs sources; docs sync check not needed."
      # Anything but an explicit 'false' runs the real check.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Validate SKILL.md frontmatter
        id: validate
        if: steps.changes.outputs.relevant != 'false'
        run: pip install 'pyyaml>=6,<7' && python3 misc/validate-frontmatter.py
      - name: Regenerate and fail on diff
        id: regen
        if: steps.changes.outputs.relevant != 'false'
        run: |
          ./misc/update-all-references.sh --check
          ./misc/update-pages.sh --check
      - name: How to fix frontmatter validation (shown on failure)
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## SKILL.md frontmatter failed validation

          `misc/validate-frontmatter.py` strict-parses the frontmatter of every `skills/*/SKILL.md` and `devops-agent/*/SKILL.md`. Check the job log above for the exact file and error, then verify:

          - the frontmatter is valid YAML (a mapping between `---` delimiters — watch unquoted `:` and stray quotes)
          - `name` and `description` keys are present
          - `description` is at most 1024 characters
          - only expected top-level keys are used: `name`, `description`, `license`, `metadata`, `allowed-tools`
          - no YAML anchors or aliases (`&`/`*`)
          - the frontmatter block is under 64KB
          - nesting depth is at most 8
          - for `skills/*/SKILL.md` only: `description` matches the generated `skills.json` manifest (`devops-agent/` is exempt; a missing manifest entry is only a warning) — if you changed a description, regenerate:

          ```bash
          ./misc/update-all-references.sh && ./misc/update-pages.sh && git add -A
          git commit -m "docs: regenerate reference tables and pages"
          ```
          EOF
      - name: How to fix stale docs (shown on failure)
        if: failure() && steps.regen.outcome == 'failure'
        env:
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Docs auto-gen blocks are stale

          One of the marker-delimited catalogues in `README.md` or `skills/README.md` (Skills Reference, Steering Reference, Examples Reference) diverged from the source of truth (`skills/*/SKILL.md`, `steering/**/*.md`, or `examples/**/README.md` frontmatter). The exact diff is in the job log above.

          **Fix:**
          ```bash
          ./misc/update-all-references.sh && ./misc/update-pages.sh && git add -A
          git commit -m "docs: regenerate reference tables and pages"
          ```

          EOF
          printf 'Full details: [`CONTRIBUTING.md` → Keeping docs in sync](%s/%s/blob/%s/CONTRIBUTING.md#keeping-docs-in-sync-auto-generated-catalogues).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${BRANCH_REF}" >> "$GITHUB_STEP_SUMMARY"
