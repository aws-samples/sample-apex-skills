name: evals

on:
  # No paths filter on pull_request: a required check whose workflow is
  # skipped by a paths filter stays Pending and blocks the merge. The job
  # runs on every pull request and skips its real work when no watched path
  # changed (see .github/scripts/ci-gate.sh).
  pull_request:
  push:
    branches:
      - main
  # Runs the model-backed eval-gate job by hand (see that job). The other
  # jobs also run on a dispatch, as on any non-pull_request event.
  workflow_dispatch:
    inputs:
      skill:
        description: 'Run key to gate (empty: every run key, which no longer fits the job timeout; pass one key)'
        required: false
        default: ''

permissions:
  contents: read

# A dispatched run has its own group, so a push to main does not stop a
# running gate: a running dispatched run is never cancelled; a newer dispatch
# replaces one still pending. A newer push or pull request run still cancels
# the older one.
concurrency:
  group: evals-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  hygiene:
    name: eval set hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing: at depth 1 ci-gate.sh cannot find the base commit, so it
          # reports relevant=true on every pull request (fails safe, saves nothing).
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'misc/evals/**'
          'skills/**'
          'misc/tests/test_check_hygiene.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - name: No-op (no watched path changed)
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No change to skills/ or misc/evals/; eval hygiene check not needed."
      # Anything but an explicit 'false' runs the real check.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run eval hygiene pre-flight
        if: steps.changes.outputs.relevant != 'false'
        run: pip install 'pyyaml>=6,<7' && python3 misc/evals/scripts/check_hygiene.py
      - name: Run hygiene check tests
        if: steps.changes.outputs.relevant != 'false'
        run: python3 -B misc/tests/test_check_hygiene.py -v

  gitops-regressions:
    name: eks-recon GitOps regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-recon/**'
          'devops-agent/eks-recon/**'
          'misc/tests/test_eks_recon_gitops.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline GitOps fixtures and lane contract checks
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 misc/tests/test_eks_recon_gitops.py -v

  eks-security-regressions:
    name: eks-security advisory and posture regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-security/**'
          'devops-agent/eks-security/**'
          'misc/tests/test_eks_security_match.py'
          'misc/tests/test_eks_security_posture_collect.py'
          'misc/tests/fixtures/eks_security_cases.json'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eks-security fixtures and read-only guard
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 -B misc/tests/test_eks_security_match.py -v && python3 -B misc/tests/test_eks_security_posture_collect.py -v

  eks-cost-read-coverage:
    name: eks-cost-intelligence read coverage regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-cost-intelligence/**'
          'misc/tests/test_eks_cost_read_coverage.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eks-cost-intelligence read coverage checks
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 -B misc/tests/test_eks_cost_read_coverage.py -v

  eks-recon-jq-null:
    name: eks-recon jq null-handling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-recon/**'
          'devops-agent/eks-recon/**'
          'misc/tests/test_eks_recon_jq_null.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eks-recon jq null-handling checks
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 -B misc/tests/test_eks_recon_jq_null.py -v

  eval-script-regressions:
    name: eval scripts and frontmatter parser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'misc/evals/scripts/**'
          'misc/evals/Makefile'
          'misc/safe_frontmatter.py'
          'classes/steward/scripts/run_checks.py'
          'misc/tests/test_parse_trajectory_tokens.py'
          'misc/tests/test_eval_runner_robust.py'
          'misc/tests/test_safe_frontmatter.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eval script and frontmatter parser checks
        if: steps.changes.outputs.relevant != 'false'
        run: pip install 'pyyaml>=6,<7' && python3 -B misc/tests/test_parse_trajectory_tokens.py -v && python3 -B misc/tests/test_eval_runner_robust.py -v && python3 -B misc/tests/test_safe_frontmatter.py -v

  service-eks-preflight:
    name: service-eks preflight regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'classes/service-eks/**'
          'skills/**'
          'misc/tests/test_service_eks_preflight.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline service-eks preflight checks
        if: steps.changes.outputs.relevant != 'false'
        run: python3 -B misc/tests/test_service_eks_preflight.py -v

  # The model-backed merge gate: `make -C misc/evals gate` or
  # `gate-all` runs the deterministic stages, then the task evals with_skill
  # against the skill at v1.3.0, scored per case on Pass@k, then, when they
  # exit 0, the trigger queries with_skill against the skill at v1.3.0,
  # scored per query; it exits 2 on a regression.
  # It runs once per harness in the matrix. CI does not run kiro: its model
  # calls go to Kiro's own service, not to Bedrock in the eval account. It
  # has no pass path without its secrets: the
  # first step fails when any is absent, and a fork pull request gets none
  # (GitHub passes no secret but GITHUB_TOKEN to a fork's run).
  # This repository sets no eval secrets, so the job stays dispatch-only;
  # live gate runs happen locally with
  # `make -C misc/evals gate`.
  # It must not be a required check
  # while the `if:` is there: GitHub counts a job that did not run as passing
  # a required check.
  eval-gate:
    name: eval merge gate (model-backed, ${{ matrix.harness }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base arm reads the skill at the v1.3.0 tag from git objects.
          fetch-depth: 0
          # No token in .git/config for the subject to read.
          persist-credentials: false
      # The secrets are set only on the two steps that read them,
      # so no subject or grader inherits them in its environment; the config file they write stays readable by path.
      - name: Require the eval secrets
        env:
          APEX_EVAL_AWS_CONFIG: ${{ secrets.APEX_EVAL_AWS_CONFIG }}
          APEX_EVAL_EXPECTED_ACCOUNT: ${{ secrets.APEX_EVAL_EXPECTED_ACCOUNT }}
        run: |
          missing=""
          [ -n "$APEX_EVAL_AWS_CONFIG" ] || missing="$missing APEX_EVAL_AWS_CONFIG"
          [ -n "$APEX_EVAL_EXPECTED_ACCOUNT" ] || missing="$missing APEX_EVAL_EXPECTED_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::eval gate cannot run, repository secrets not set:$missing (a fork pull request gets no secrets)"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install the eval tools
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          pip install 'jsonschema[format-nongpl]>=4.26,<5' 'pyyaml>=6,<7'
          # The subject wall (run_triggering.wall_off_host) needs bwrap.
          sudo apt-get install -y bubblewrap
          # Pinned to the CLI versions the adapters and parsers were written
          # against. The grader is claude -p on every harness.
          npm install -g @anthropic-ai/claude-code@2.1.328
          if [ "$HARNESS" = codex ]; then npm install -g @openai/codex@0.163.0; fi
      - name: Write the eval-role config
        env:
          # aws-config for profile apex-eval-admin, which assumes apex-eval-bedrock-invoke
          # (misc/evals/README.md, "Eval-role setup").
          APEX_EVAL_AWS_CONFIG: ${{ secrets.APEX_EVAL_AWS_CONFIG }}
          # The eval account id (12 digits) the session must prove.
          APEX_EVAL_EXPECTED_ACCOUNT: ${{ secrets.APEX_EVAL_EXPECTED_ACCOUNT }}
        run: |
          umask 077
          mkdir -p "$HOME/.apex-eval"
          printf '%s\n' "$APEX_EVAL_AWS_CONFIG" > "$HOME/.apex-eval/aws-config"
          printf '%s\n' "$APEX_EVAL_EXPECTED_ACCOUNT" > "$HOME/.apex-eval/expected-account"
      - name: Run the gate
        env:
          HARNESS: ${{ matrix.harness }}
          GATE_SKILL: ${{ inputs.skill }}
        run: |
          if [ -n "$GATE_SKILL" ]; then
            # Checked here, before make expands it (a $(...) in SKILL runs
            # during make's own expansion, before the Makefile's check).
            [[ "$GATE_SKILL" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::skill must match [A-Za-z0-9_.-]+"; exit 1; }
            make -C misc/evals gate SKILL="$GATE_SKILL" HARNESS="$HARNESS"
          else
            make -C misc/evals gate-all HARNESS="$HARNESS"
          fi
