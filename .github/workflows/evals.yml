name: evals

on:
  pull_request:
    paths:
      - "misc/evals/**"
      - "skills/**"
      - ".github/workflows/evals.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: eval set hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Run eval hygiene pre-flight
        run: pip install 'pyyaml>=6,<7' && python3 misc/evals/scripts/check_hygiene.py
