name: evals

# Deterministic, offline gate for skill + eval hygiene. No Bedrock, no EKS
# cluster, no `claude -p` calls — those run locally or on a scheduled job,
# not per PR.
#
# Job 1 (coverage): every skills/<name>/ has a matching misc/evals/<name>/.
# Job 2 (hygiene):  every misc/evals/<name>/ passes quick_validate, has the
#                   minimum positives/negatives in triggering.json, has ≥2
#                   prompts with ≥3 expectations in evals.json, and every
#                   negative index is attributed in the SIBLING_MAP block.

on:
  pull_request:
    paths:
      - "skills/**"
      - "steering/**"
      - "examples/**"
      - "misc/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/evals.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: evals coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML (used by skill-creator/quick_validate.py)
        run: pip install pyyaml
      - name: Check every skill has a misc/evals/ entry
        run: make -C misc/evals check-evals-coverage
      - name: How to fix (shown on failure)
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Evals coverage failed

          A skill under `skills/` has no matching `misc/evals/<name>/` directory.

          **Fix — recommended (walks the full onboarding workflow):**
          ```
          /apex:new-skill
          ```

          **Fix — manual:**
          ```bash
          cd misc/evals
          make init-evals SKILL=<name> [SIBLINGS="a,b,c"]
          # edit triggering.json, evals.json, README.md
          make init-evals-finalize SKILL=<name>
          ```

          Full details: [`misc/evals/README.md` → Adding evals for a new skill](../blob/${{ github.head_ref || github.ref_name }}/misc/evals/README.md#adding-evals-for-a-new-skill).
          EOF

  hygiene:
    name: evals hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML (used by skill-creator/quick_validate.py)
        run: pip install pyyaml
      - name: Hygiene pre-flight (no model, no cluster)
        run: make -C misc/evals hygiene
      - name: How to fix (shown on failure)
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Evals hygiene failed

          At least one `misc/evals/<skill>/` entry failed the pre-flight checks (frontmatter, positives/negatives count, SIBLING_MAP attribution, `evals.json` prompt/expectation count, …). The specific warnings are in the job log above.

          **Fix — single skill:**
          ```bash
          make -C misc/evals init-evals-finalize SKILL=<name>
          ```

          **Fix — every skill (same checks CI runs):**
          ```bash
          make -C misc/evals hygiene
          ```

          The structure the checks enforce is documented in [`misc/evals/README.md` → Adding evals for a new skill](../blob/${{ github.head_ref || github.ref_name }}/misc/evals/README.md#adding-evals-for-a-new-skill).
          EOF

  docs-sync:
    name: docs auto-gen blocks are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and fail on diff
        run: |
          ./misc/update-all-references.sh --check
          ./misc/update-pages.sh --check
      - name: How to fix (shown on failure)
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Docs auto-gen blocks are stale

          One of the marker-delimited catalogues in `README.md` or `skills/README.md` (Skills Reference, Steering Reference, Examples Reference) diverged from the source of truth (`skills/*/SKILL.md`, `steering/**/*.md`, or `examples/**/README.md` frontmatter). The exact diff is in the job log above.

          **Fix:**
          ```bash
          ./misc/update-all-references.sh && ./misc/update-pages.sh && git add -A
          git commit -m "docs: regenerate reference tables and pages"
          ```

          Full details: [`CONTRIBUTING.md` → Keeping docs in sync](../blob/${{ github.head_ref || github.ref_name }}/CONTRIBUTING.md#keeping-docs-in-sync-auto-generated-catalogues).
          EOF

  regression:
    name: regression gate
    runs-on: ubuntu-latest
    needs: [hygiene]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Detect changed skills
        id: changes
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -oP '(?<=skills/)[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "skills=${changed}" >> "$GITHUB_OUTPUT"
      - name: Run regression check
        if: steps.changes.outputs.skills != ''
        run: |
          IFS=',' read -ra SKILLS <<< "${{ steps.changes.outputs.skills }}"
          exit_code=0
          for skill in "${SKILLS[@]}"; do
            baseline="misc/evals/${skill}/baselines/baseline.json"
            if [ ! -f "$baseline" ]; then
              echo "::notice::No baseline for ${skill} — skipping regression check"
              continue
            fi
            python3 misc/evals/scripts/regression.py \
              --skill "$skill" \
              --threshold 5 \
              --from-history || exit_code=$?
          done
          exit $exit_code
      - name: How to fix (shown on failure)
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Regression gate failed

          At least one skill's eval scores regressed beyond the 5pp threshold
          compared to its committed baseline.

          **Fix options:**
          1. Fix the regression in your skill code
          2. If the regression is intentional (e.g. tightened description), update the baseline:
             ```bash
             make -C misc/evals task-<skill> RUNS_PER_PROMPT=3
             make -C misc/evals snapshot SKILL=<skill>
             git add misc/evals/<skill>/baselines/baseline.json
             ```
          EOF
