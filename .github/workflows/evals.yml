name: evals

on:
  # No paths filter on pull_request: a required check whose workflow is
  # skipped by a paths filter stays Pending and blocks the merge. The job
  # runs on every pull request and skips its real work when no watched path
  # changed (see .github/scripts/ci-gate.sh).
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: eval set hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing: at depth 1 ci-gate.sh cannot find the base commit, so it
          # reports relevant=true on every pull request (fails safe, saves nothing).
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'misc/evals/**'
          'skills/**'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - name: No-op (no watched path changed)
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No change to skills/ or misc/evals/; eval hygiene check not needed."
      # Anything but an explicit 'false' runs the real check.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run eval hygiene pre-flight
        if: steps.changes.outputs.relevant != 'false'
        run: pip install 'pyyaml>=6,<7' && python3 misc/evals/scripts/check_hygiene.py

  gitops-regressions:
    name: eks-recon GitOps regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-recon/**'
          'devops-agent/eks-recon/**'
          'misc/tests/test_eks_recon_gitops.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline GitOps fixtures and lane contract checks
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 misc/tests/test_eks_recon_gitops.py -v

  eks-security-regressions:
    name: eks-security advisory and posture regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-security/**'
          'devops-agent/eks-security/**'
          'misc/tests/test_eks_security_match.py'
          'misc/tests/test_eks_security_posture_collect.py'
          'misc/tests/fixtures/eks_security_cases.json'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eks-security fixtures and read-only guard
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 -B misc/tests/test_eks_security_match.py -v && python3 -B misc/tests/test_eks_security_posture_collect.py -v

  eks-cost-read-coverage:
    name: eks-cost-intelligence read coverage regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-cost-intelligence/**'
          'misc/tests/test_eks_cost_read_coverage.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eks-cost-intelligence read coverage checks
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 -B misc/tests/test_eks_cost_read_coverage.py -v

  eks-recon-jq-null:
    name: eks-recon jq null-handling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'skills/eks-recon/**'
          'devops-agent/eks-recon/**'
          'misc/tests/test_eks_recon_jq_null.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eks-recon jq null-handling checks
        if: steps.changes.outputs.relevant != 'false'
        run: jq --version && python3 -B misc/tests/test_eks_recon_jq_null.py -v

  eval-script-regressions:
    name: eval scripts and frontmatter parser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this change needs the check
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bash .github/scripts/ci-gate.sh changed
          'misc/evals/scripts/**'
          'misc/safe_frontmatter.py'
          'misc/tests/test_parse_trajectory_tokens.py'
          'misc/tests/test_safe_frontmatter.py'
          '.github/workflows/evals.yml'
          '.github/scripts/ci-gate.sh'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      - name: Run offline eval script and frontmatter parser checks
        if: steps.changes.outputs.relevant != 'false'
        run: pip install 'pyyaml>=6,<7' && python3 -B misc/tests/test_parse_trajectory_tokens.py -v && python3 -B misc/tests/test_safe_frontmatter.py -v
