name: docs

on:
  push:
    branches:
      - main
    paths:
      - "misc/website/**"
      - "misc/update-pages.sh"
      - "skills/**/SKILL.md"
      - "skills/apex/runbooks/**"
      - "examples/**/README.md"
      - "devops-agent/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so showLastUpdateTime and the sitemap lastmod read each
          # file's own last commit instead of the single shallow-clone commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: misc/website/package-lock.json

      - run: npm ci
        working-directory: misc/website

      - run: npm run build
        working-directory: misc/website

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: misc/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
