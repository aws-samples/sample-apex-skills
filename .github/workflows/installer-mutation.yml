name: installer-mutation

# The mutation gate for the npx installer (misc/installer/test/mutate.sh): the
# install-path harness runs against copies of bin/cli.mjs with one deliberate
# defect each and must fail on every one. A surviving mutant means a behavior
# the harness claims to cover is not tested. It runs the whole harness once per
# mutant, so it runs weekly and on demand, not on every pull request.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-mutation
  cancel-in-progress: false

jobs:
  mutate:
    name: installer mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Cases V7, OLD1 and IS3 need the v1.2.0 and v1.3.0 tags and commit 6103231, so fetch the full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Every mutant is killed
        run: bash misc/installer/test/mutate.sh
