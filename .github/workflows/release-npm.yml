name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: misc/installer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC provenance support
        run: npm install -g npm@11

      - name: Verify version matches tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *) echo "::error::Release tag ($GITHUB_REF_NAME) must match v[0-9]* (for example v1.3.0)"; exit 1 ;;
          esac
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Smoke test
        run: node bin/cli.mjs --help

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "apex-skills@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine dist-tag
        id: dist-tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A Release marked pre-release publishes to next, so a final version
          # (1.3.0) can ship on next first; promoting it to latest is a manual
          # npm dist-tag add apex-skills@<version> latest (CONTRIBUTING.md).
          if [ "$PRERELEASE" = "true" ] || echo "$VERSION" | grep -q '-'; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --tag ${{ steps.dist-tag.outputs.tag }}
