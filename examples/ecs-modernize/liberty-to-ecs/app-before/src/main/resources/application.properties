# =============================================================================
# PLANTED (config_externalization): environment-specific endpoints AND a
# credential are committed in this file. The same build cannot move between
# environments, and the secret is distributed in every image layer.
#
# NOTE FOR READERS: every value below is a fabricated placeholder for a
# training exercise. The host names are RFC 2606 reserved example domains and
# the password is a literal dummy string. Nothing here is a real credential.
# =============================================================================

# Hardcoded production endpoint baked into the artifact
orders.db.url=jdbc:db2://db2prod01.orders.example.com:50000/ORDERS
orders.db.user=ORDERSAPP

# PLANTED: committed credential (dummy value, see note above)
orders.db.password=NotARealPassword123

# Hardcoded downstream service endpoints
pricing.service.endpoint=http://pricing-prod.orders.example.com:9080/pricing
tax.service.endpoint=http://tax-prod.orders.example.com:9080/tax

# PLANTED (state_management / os_host_dependency): local state directory
orders.archive.dir=/opt/was/orders/archive

# PLANTED (dependency_coupling): host-local MQ binding — a bindings-mode
# (shared-memory) connection requires the queue manager on the same host,
# which no separate container can satisfy.
orders.mq.queueManager=QMGR1
orders.mq.connectionMode=bindings
orders.mq.channel=SYSTEM.DEF.SVRCONN
