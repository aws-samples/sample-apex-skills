# Operator / Solutions: skills that do a task, with confirmation before any
# change. Typed input and checked output sit here; determinism and the OS
# matrix stay in Script.

name: operator
parents: [platform]

# operator.artifact-checks: a member declares its checks in
# metadata.apex-artifact-checks. Today they sit in
# misc/evals/<skill>/.skilleval.yaml (eks-build: terraform-validate,
# terraform-fmt, checkov, structural); the target adds tflint, a security
# scan, requirement coverage and a plan against a fixture.

checks:
  - id: declared-artifact-checks
    what: "The declared checks run on fixture artifacts in CI"
    status: planned

# Opt-in PreToolUse hooks; the fields are described in apex-base/class.yaml.
# Codex and Kiro have no PreToolUse ask, so there an ask-mode hook blocks.
hooks:
  - id: operator.confirm-before-change
    what: "Ask the user before a cloud or cluster write: kubectl, helm, terraform, eksctl and aws writes, EKS MCP Server write tools and structured AWS calls"
    event: PreToolUse
    script: hooks/mutation-guard/mutation_guard.py
    mode: ask
    enabled: false
    matchers:
      claude-code: "^(Bash|use_aws|mcp__.*)$"
      codex: "^(Bash|use_aws|mcp__.*)$"
      kiro: "^(execute_bash|execute_pwsh|run_command|use_aws|mcp_.*)$"
