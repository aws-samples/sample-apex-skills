# Operator / Solutions: skills that do a task, with confirmation before any
# change. Typed input and checked output sit here; determinism and the OS
# matrix stay in Script.

name: operator
parents: [platform]

open:
  - "operator.artifact-checks: the key a skill uses to declare its checks; today they sit in misc/evals/<skill>/.skilleval.yaml (eks-build today: terraform-validate, terraform-fmt, checkov, structural; the target adds tflint, a plan against a fixture and requirement coverage)"

checks:
  - id: declared-artifact-checks
    what: "The declared checks run on fixture artifacts in CI"
    status: planned
