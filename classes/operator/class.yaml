# Operator / Solutions: skills that do a task, with confirmation before any
# change. Typed input and checked output sit here; determinism and the OS
# matrix stay in Script.

name: operator
parents: [platform]

# operator.artifact-checks: a member declares its checks in
# metadata.apex-artifact-checks. Today they sit in
# misc/evals/<skill>/.skilleval.yaml (eks-build: terraform-validate,
# terraform-fmt, checkov, structural); the target adds tflint, a security
# scan, requirement coverage and a plan against a fixture.

checks:
  - id: declared-artifact-checks
    what: "The declared checks run on fixture artifacts in CI"
    status: planned

# The Stop gate (piece 8), one gate for Operator and Script members. Before a
# turn ends it re-runs the validator on a Script skill's output and an
# Operator skill's declared artifact checks (operator.artifact-checks).
# Script's parent is operator, so this one entry reaches both classes.
hooks:
  - id: operator.stop-gate
    what: "The turn does not end until the skill's output, or its declared artifact checks, pass"
    status: planned
    event: Stop
    script: "../script/hooks/stop-gate/gate.py"
    mode: block
