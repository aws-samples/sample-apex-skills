# Operator / Solutions: skills that do a task, with confirmation before any
# change. Typed input and checked output sit here; determinism and the OS
# matrix stay in Script (the Script contract split, R:196, R:381).
# plan: R:192 (Operator row), R:202 (Enforces row)

name: operator
title: Operator
parents: [platform]

inline: rules.md

rules:
  operator.confirm-before-change:
    plan: "1.6 classes table (R:192)"
    from: "skills/ecs-modernize/SKILL.md:133, :142 (Execution_Gate, explicit approval), class survey"
  operator.typed-input:
    plan: "1.6 classes table (R:192); the split (R:196)"
  operator.artifact-checks:
    plan: "1.6 classes table (R:192); Enforces row (R:202): eks-build terraform validate, fmt, tflint, a security scan, requirement coverage, a plan against a fixture; eks-design structure checks on its doc and diagrams"
