# Advisor / Knowledge: skills that advise and ship nothing that runs.
# Built because its four members (eks-best-practices, eks-genai,
# eks-platform-engineering, ecs-genai) share that: no tools/ or scripts/,
# and in SKILL.md no shell fence and no aws command line (read at
# sample-apex-skills 9157fe03).

name: advisor
parents: [platform]

# eks-platform-engineering's one assistant rule (SKILL.md, Guardrails)
# pauses an ArgoCD sync only when the user explicitly asks, which is
# advisor.no-side-effects as written.

checks:
  - id: no-shipped-runnables
    what: "The member ships no tools/ or scripts/; its SKILL.md holds no shell fence or command line to run; every line in references/ that changes a cluster or account (the hand-classified list in the class survey, not a verb regex) is marked customer-run, in one of three forms: the marker on the line above a fence, at the end of the line, or on a blockquote line above a quoted fence. `aws eks update-kubeconfig` is exempt (apex.read-only-unless-confirmed)"
    status: planned
