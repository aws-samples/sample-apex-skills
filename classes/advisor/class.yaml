# Advisor / Knowledge: skills that advise and ship nothing that runs.
# Built because its four members (eks-best-practices, eks-genai,
# eks-platform-engineering, ecs-genai) share that: no tools/ or scripts/,
# and in SKILL.md no shell fence and no aws command line (read at
# sample-apex-skills 9157fe03).

name: advisor
parents: [platform]

# eks-platform-engineering's one assistant rule (SKILL.md, Guardrails)
# pauses an ArgoCD sync only when the user explicitly asks, which is
# advisor.no-side-effects as written.

checks:
  - id: no-shipped-runnables
    what: "The member ships no tools/ or scripts/; its SKILL.md holds no shell fence and no aws, kubectl, helm or eksctl command line; every line in references/ that changes a cluster or account (kubectl apply/create/delete/patch/annotate/label/edit, helm install/upgrade, aws create-/delete-/update-/put-/associate-, eksctl create/delete) sits in a block marked customer-run"
    status: planned
