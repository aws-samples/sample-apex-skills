# Steward: skills that maintain the APEX repo (update-docs, apex-new-skill).
# Its members run the repo generators below, the add-a-skill steps and the
# class sync.

name: steward
parents: [apex-base]

# The repo generators and their --check modes. CI runs the --check forms in
# .github/workflows/docs-sync.yml:56-62.
generators:
  - run: "./misc/update-all-references.sh"
    check: "./misc/update-all-references.sh --check"
    status: exists
  - run: "./misc/update-pages.sh"
    check: "./misc/update-pages.sh --check"
    status: exists
    note: "reads the git index (git ls-files): git add new files first"
  - run: "python3 misc/sync-classes.py"
    check: "python3 misc/sync-classes.py --check"
    status: exists

# Hand-kept, not generated.
hand_kept:
  - "misc/website/src/components/skillCatalog.ts (LINES)"
  - "misc/website/src/components/skillSearch.ts (PORTS)"

add_a_skill: "CONTRIBUTING.md, Creating a New Skill, steps 1-7; then run the class sync (python3 misc/sync-classes.py)"
