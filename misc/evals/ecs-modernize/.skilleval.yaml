skill_name: ecs-modernize
artifact_type: null

# Weight rationale: ecs-modernize produces artifacts (Dockerfiles, Terraform,
# Modernization_Reports) in its execution phase. evals.json carries
# process_assertions on cases 9, 12 and 13 and artifact_assertions on cases
# 1, 9, 12, 13, 18, 19 and 21, and no knowledge_assertions. Layers 1-3 stay disabled
# here until the layer weights are decided, so those checks run and write
# their results but carry no weight in the composite. The weight sits on the
# two enabled layers: triggering (layer 0, 19 prompts in triggering.json) and
# quality (layer 4, the LLM grader over 21 task evals). Quality carries the
# larger share because the expectations encode the skill's behavioural
# contract (read-only assessment, Execution_Gate, per-action-class
# confirmations, delegation boundaries).

layers:
  triggering:
    enabled: true
  process:
    enabled: false
  artifact:
    enabled: false
    validators: []
  knowledge:
    enabled: false
  quality:
    enabled: true

weights:
  triggering: 0.30
  quality: 0.70

regression:
  threshold: 5.0
  pass_k: 3

timeout: 1800
